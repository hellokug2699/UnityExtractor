[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unity-extractor"
version = "0.1.0"
description = "Evidence-based scanner for Unity game packages and resource layouts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "UnityExtractor contributors" }]
dependencies = []

[project.scripts]
unity-extractor = "unity_extractor.cli:main"
unity-extractor-verify-archive = "unity_extractor.archive_validator:main"
unity-extractor-desktop = "unity_extractor.platforms.desktop.app:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
unity = ["UnityPy>=1.25.3,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
